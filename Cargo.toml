[package]
name = "zerosum"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Provably-fair CLI games you play against each other — zero-sum. First game: Farkle."
license = "MIT OR Apache-2.0"
repository = "https://github.com/greytau/0sum"
authors = ["Cory Zibell <cory@zibell.cloud>"]

[[bin]]
name = "0sum"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
